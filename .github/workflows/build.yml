name: Build APK

on:
  push:
    branches: [main, ci-test]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ScreenTranslate-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslate-v${{ steps.apk.outputs.version }}
          path: dist/*.apk

      # main 每次推送都更新「latest」預先發行版，手機打開固定網址即可下載最新 APK
      - name: Publish rolling latest
        if: github.ref == 'refs/heads/main'
        run: |
          cp dist/*.apk ScreenTranslate-latest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenTranslate-latest.apk \
            --prerelease --title "最新版（自動編譯 v${{ steps.apk.outputs.version }}）" \
            --notes "commit ${GITHUB_SHA::7} 自動編譯。手機直接點下方 APK 下載安裝。" \
            --target "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}

      # 推送 vX.Y.Z tag 時，自動建立 GitHub Release，手機瀏覽器可直接下載
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
